  <!-- Full Engine JS -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const searchInput = document.getElementById("searchInput");
      const clearSearchBtn = document.getElementById("clearSearchBtn");
      const resetFilterBtn = document.getElementById("resetFilterBtn");
      const catSales = document.getElementById("catSales");
      const catRentals = document.getElementById("catRentals");
      const catTenders = document.getElementById("catTenders");
      
      const navHome = document.getElementById("navHome");
      const navSearchTab = document.getElementById("navSearchTab");
      const navAdd = document.getElementById("navAdd");
      const navChat = document.getElementById("navChat");
      const navProfile = document.getElementById("navProfile");
      const cards = document.querySelectorAll(".listing-card");

      const postModal = document.getElementById("postModal");
      const closeModalBtn = document.getElementById("closeModalBtn");
      const postForm = document.getElementById("postForm");

      const walletBtn = document.getElementById("walletBtn");
      const walletModal = document.getElementById("walletModal");
      const closeWalletBtn = document.getElementById("closeWalletBtn");
      const walletBalanceDisplay = document.getElementById("walletBalanceDisplay");
      const modalWalletBalance = document.getElementById("modalWalletBalance");
      const topupAmount = document.getElementById("topupAmount");
      const topupBtn = document.getElementById("topupBtn");

      let userWallet = parseFloat(localStorage.getItem("dessie_wallet") || "250.00");
      function updateWalletUI() {
        walletBalanceDisplay.innerText = userWallet.toFixed(2) + " Br";
        modalWalletBalance.innerText = userWallet.toFixed(2) + " ብር";
        localStorage.setItem("dessie_wallet", userWallet);
      }
      updateWalletUI();

      walletBtn.addEventListener("click", () => walletModal.classList.remove("hidden"));
      closeWalletBtn.addEventListener("click", () => walletModal.classList.add("hidden"));

      topupBtn.addEventListener("click", () => {
        const amt = parseFloat(topupAmount.value);
        if (!amt || amt <= 0) { alert("እባክዎ ትክክለኛ መጠን ያስገቡ!"); return; }
        userWallet += amt;
        updateWalletUI();
        alert(`🎉 በ성공 ሁኔታ ${amt} ብር ወደ ዋሌትዎ ገብቷል!`);
        topupAmount.value = "";
        walletModal.classList.add("hidden");
      });

      const BOT_TOKEN = "8839692572:AAECMsxjgvTpsQI_hshWLYs7EvQgRhqYGs";
      const CHANNEL_ID = "@DessieMarket";

      if (searchInput) {
        searchInput.addEventListener("input", (e) => {
          const val = e.target.value.toLowerCase();
          cards.forEach(card => {
            const title = card.getAttribute("data-title").toLowerCase();
            card.style.display = title.includes(val) ? "flex" : "none";
          });
        });
      }

      if (clearSearchBtn) {
        clearSearchBtn.addEventListener("click", () => {
          if (searchInput) searchInput.value = "";
          cards.forEach(card => card.style.display = "flex");
        });
      }

      function filterCat(category) {
        cards.forEach(card => {
          const cat = card.getAttribute("data-category");
          card.style.display = (cat === category) ? "flex" : "none";
        });
      }

      if (catSales) catSales.addEventListener("click", () => filterCat("ሽያጭ"));
      if (catRentals) catRentals.addEventListener("click", () => filterCat("ኪራይ"));
      if (catTenders) catTenders.addEventListener("click", () => filterCat("ጨረታ"));

      if (resetFilterBtn) {
        resetFilterBtn.addEventListener("click", (e) => {
          e.preventDefault();
          cards.forEach(card => card.style.display = "flex");
          if (searchInput) searchInput.value = "";
        });
      }

      function openModal() { postModal.classList.remove("hidden"); }
      function closeModal() { postModal.classList.add("hidden"); }

      if (navAdd) navAdd.addEventListener("click", openModal);
      if (closeModalBtn) closeModalBtn.addEventListener("click", closeModal);

      if (navHome) {
        navHome.addEventListener("click", (e) => {
          e.preventDefault();
          cards.forEach(card => card.style.display = "flex");
          if (searchInput) searchInput.value = "";
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });
      }

      if (navSearchTab) {
        navSearchTab.addEventListener("click", (e) => {
          e.preventDefault();
          if (searchInput) {
            searchInput.focus();
            window.scrollTo({ top: 0, behavior: 'smooth' });
          }
        });
      }

      if (navChat) {
        navChat.addEventListener("click", (e) => {
          e.preventDefault();
          window.open("https://t.me/DessieMarket", "_blank");
        });
      }

      if (navProfile) {
        navProfile.addEventListener("click", (e) => {
          e.preventDefault();
          alert("ደሴ ማርት (ሙጋድ ገበያ) - ፕሪሚየም ስሪት 2.0.0\nሙሉ የክፍያ እና የዋሌት ሲስተም የተዋቀረበት መድረክ።");
        });
      }

      if (postForm) {
        postForm.addEventListener("submit", async (e) => {
          e.preventDefault();
          const title = document.getElementById("postTitle").value;
          const price = document.getElementById("postPrice").value;
          const category = document.getElementById("postCategory").value;
          const location = document.getElementById("postLocation").value;
          const phone = document.getElementById("postPhone").value;
          const paymentMethod = document.querySelector('input[name="paymentMethod"]:checked').value;
          const txId = document.getElementById("txId").value;

          const submitBtn = document.getElementById("submitBtn");
          submitBtn.disabled = true;
          submitBtn.innerText = "ክፍያ በመረጋገጥ ላይ...";

          const messageText = `🚨 *አዲስ ማስታወቂያ (ፕሪሚየም) - ደሴ ማርት* 🚨\n\n📌 *ርዕስ:* ${title}\n📂 *ምድብ:* ${category}\n💰 *ዋጋ:* ${price} ብር\n📍 *አድራሻ:* ${location}\n📞 *ስልክ:* ${phone}\n💳 *የክፍያ ዘዴ:* ${paymentMethod.toUpperCase()}\n🆔 *TxID:* ${txId}\n\n✨ *በደሴ ማርት ሞባይል መተግበሪያ የተለጠፈ*`;

          try {
            const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                chat_id: CHANNEL_ID,
                text: messageText,
                parse_mode: 'Markdown'
              })
            });

            const data = await res.json();
            if (data.ok) {
              alert("🎉 ክፍያዎ ተረጋግጦ ማስታወቂያዎ በሰከንዶች ውስጥ ወደ ቴሌግራም ቻናል (@DessieMarket) ተልኳል!");
              postForm.reset();
              closeModal();
            } else {
              alert("⚠️ ማስታወቂያውን መላክ አልተቻለም፦ " + data.description);
            }
          } catch (err) {
            console.error(err);
            alert("❌ የኔትወርክ ስህተት አጋጥሟል!");
          } finally {
            submitBtn.disabled = false;
            submitBtn.innerHTML = `<span class="material-symbols-outlined text-sm">verified</span><span>ክፍያ አረጋግጦ ወደ ቴሌግራም ልጥፍ</span>`;
          }
        });
      }

      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("/sw.js").then((reg) => {
          console.log("✅ ደሴ ማርት ServiceWorker ተመዝግቧል:", reg.scope);
        }).catch((err) => {
          console.error("ServiceWorker ስህተት:", err);
        });
      }
    });
  </script>
</body>
</html>
